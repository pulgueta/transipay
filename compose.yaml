services:
  postgres:
    image: docker.io/library/postgres:18-alpine
    environment:
      POSTGRES_USER: transipay
      POSTGRES_PASSWORD: transipay
      POSTGRES_DB: transipay
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U transipay -d transipay"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
